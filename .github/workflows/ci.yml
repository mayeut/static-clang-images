name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'
    branches:
      - main
    tags:
      - "v*.*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  llvm-version:
    name: Get LLVM version to build
    needs: lint
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      version: ${{ steps.llvm-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get LLVM version
        id: llvm-version
        run: echo "version=$(cat llvm-version)" >> $GITHUB_OUTPUT

  bootstrap:
    name: Build x86_64 bootstrap artifact
    needs: llvm-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        id: setup-buildx
      - name: Cache Docker cache mounts
        if: ${{ github.ref_type != 'tag' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          path: .cache/buildx-x86_64-bootstrap-cache-mounts
          key: buildx-x86_64-bootstrap-cache-mounts-${{ github.sha }}
          restore-keys: |
            buildx-x86_64-bootstrap-cache-mounts-
      - name: Restore Docker cache mounts
        if: ${{ github.ref_type != 'tag' }}
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: .cache/buildx-x86_64-bootstrap-cache-mounts
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            LLVM_VERSION=${{ needs.llvm-version.outputs.version }}
          target: bootstrap_artifact
          tags: static-clang-bootstrap:latest
          outputs: type=tar,dest=./bootstrap_artifact.tar
      - name: Compress bootstrap artifact
        run: xz -z bootstrap_artifact.tar
      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap_artifact
          path: ./bootstrap_artifact.tar.xz
          if-no-files-found: error
          retention-days: 1

  build_image:
    name: Build ${{ matrix.platform }} image
    needs: [bootstrap, llvm-version]
    runs-on: ubuntu-latest
    permissions:
      packages: write # push to ghcr.io
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - 386
          - amd64
          - arm
          - arm64
          - loong64
          - ppc64le
          - riscv64
          - s390x

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        if: matrix.platform != 'amd64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        id: setup-buildx
      - name: Download bootstrap artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bootstrap_artifact
      - name: Cache Docker cache mounts
        if: ${{ github.ref_type != 'tag' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          path: .cache/buildx-${{ matrix.platform }}-cache-mounts
          key: buildx-${{ matrix.platform }}-cache-mounts-${{ github.sha }}
          restore-keys: |
            buildx-${{ matrix.platform }}-cache-mounts-
      - name: Restore Docker cache mounts
        if: ${{ github.ref_type != 'tag' }}
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: .cache/buildx-${{ matrix.platform }}-cache-mounts
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          load: true
          push: false
          build-args: |
            LLVM_VERSION=${{ needs.llvm-version.outputs.version }}
            BOOTSTRAP_SOURCE=artifact
          tags: static-clang:latest
          outputs: type=local,dest=./binaries
      - name: Prepare Archive
        run: tar cf - -C binaries/opt --owner 0 --group 0 clang | xz -9e -T0 > "binaries/static-clang-linux-${MATRIX_PLATFORM}.tar.xz"
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}

      # TODO add some basic tests here

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-clang-${{ matrix.platform }}
          path: binaries/static-clang-linux-${{ matrix.platform }}.tar.xz
          if-no-files-found: error
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image by digest
        if: github.event_name == 'push'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          push: true
          build-args: |
            LLVM_VERSION=${{ needs.llvm-version.outputs.version }}
            BOOTSTRAP_SOURCE=artifact
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/static-clang,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          digest="${STEPS_BUILD_OUTPUTS_DIGEST}"
          touch "/tmp/digests/${digest#sha256:}"
        env:
          STEPS_BUILD_OUTPUTS_DIGEST: ${{ steps.build.outputs.digest }}
      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write # push to ghcr.io
      contents: read
    needs:
      - build_image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/static-clang
          tags: |
            type=raw,value=edge
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}.{{patch}}
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "ghcr.io/${GITHUB_REPOSITORY_OWNER}/static-clang@sha256:%s " *)

  release_artifacts:
    name: Create release artifacts
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # create attestations
      attestations: write  # create attestations
      artifact-metadata: write  # create attestations
    needs:
      - build_image
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: static-clang-*
          merge-multiple: true
      - name: Create sha256sums.txt
        run: sha256sum *.tar.xz > sha256sums.txt
      - name: Create subject checksums
        run: sha256sum *.* > "${RUNNER_TEMP}/subject.checksums.txt"
      - name: Display subject checksums
        run: cat "${RUNNER_TEMP}/subject.checksums.txt"
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        id: attest
        with:
          subject-checksums: "${{ runner.temp }}/subject.checksums.txt"
      - name: Copy attestation bundle
        run: cp "${BUNDLE_PATH}" attestation-bundle.json
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
      - name: Display sha256sums.txt
        run: ls -al . && cat sha256sums.txt
      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: "*.*"
          if-no-files-found: error

  release:
    name: Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create release
    needs:
      - release_artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: binaries
      - name: Release # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: 'binaries/*'
